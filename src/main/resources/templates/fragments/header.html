<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
  <!-- Cabecera común. Parámetro «pagina»: 'inicio', 'reserva' o 'error' (marca el enlace activo).
       En el móvil la marca se desplaza y solo queda fija la fila de navegación. -->
  <th:block th:fragment="cabecera(pagina)">
    <a class="saltar" href="#contenido">Saltar al contenido</a>
    <header class="cabecera">
      <div class="contenedor cabecera-interior">
        <div class="cabecera-marca">
          <a class="marca" th:href="@{/}">Casita de Tercera</a>
          <!-- Solo se muestra con JavaScript (clase .js). El texto visible indica lo que hará al pulsarlo. -->
          <button type="button" class="boton-tema" data-boton-tema>
            <svg class="icono icono-luna" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
              <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            </svg>
            <svg class="icono icono-sol" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
              <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span class="texto-a-oscuro">Modo oscuro</span>
            <span class="texto-a-claro">Modo claro</span>
          </button>
        </div>
        <nav class="navegacion" aria-label="Principal">
          <ul>
            <li><a th:href="@{/#la-casa}">La casa</a></li>
            <li><a th:href="@{/#precios}">Precios</a></li>
            <li><a th:href="@{/reserva}" th:aria-current="${pagina == 'reserva'} ? 'page' : null">Reservar</a></li>
          </ul>
        </nav>
      </div>
    </header>
  </th:block>
</body>
</html>
